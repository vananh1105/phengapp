<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Sugar · Đặt trà online</title>
<link rel="manifest" href="/manifest-dat.webmanifest">
<link rel="icon" type="image/png" href="/osugar-icon-192.png">
<link rel="apple-touch-icon" href="/osugar-icon-180.png">
<meta name="apple-mobile-web-app-title" content="O Sugar">
<meta name="application-name" content="O Sugar">
<meta name="theme-color" content="#1F63C9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Coiny&family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbf4ee;--sky:#cfe3ea;--sage:#c9d8b0;--cd:#fffaf6;--ink:#3b2a2a;--mut:#8a7370;--ln:#eadbd2;--mr:#6e0f22;--pk:#f7e3e6;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231517;--sky:#26363b;--sage:#3e4a35;--cd:#2f1d20;--ink:#f6e7e3;--mut:#b79b98;--ln:#4a3236;--mr:#a8283f;--pk:#3d2429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231517;--sky:#26363b;--sage:#3e4a35;--cd:#2f1d20;--ink:#f6e7e3;--mut:#b79b98;--ln:#4a3236;--mr:#a8283f;--pk:#3d2429;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:linear-gradient(var(--sky) 0,var(--bg) 380px) no-repeat var(--bg);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;padding-bottom:96px}
.w{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;margin:0}
.top{display:flex;gap:14px;align-items:center;padding:22px 0 14px}
.logo{width:68px;height:68px;border-radius:18px;background:var(--mr);display:grid;place-items:center;font-size:34px;border:3px solid var(--cd);box-shadow:0 4px 12px rgba(110,15,34,.25);flex:none}
.top h1{font-size:34px;line-height:1.05;font-weight:700}
.top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:16px;background:var(--cd);color:var(--ink);padding:12px;font:inherit;box-shadow:0 2px 8px rgba(110,15,34,.07)}
.tile.hl{background:var(--mr);color:#fff}
.tile i{font-style:normal;width:36px;height:36px;border-radius:10px;background:var(--pk);display:grid;place-items:center;font-size:19px;flex:none}
.tile b{display:block;font:700 16px/1.2 "Baloo 2",sans-serif}
.tile small{font-size:12px;opacity:.8}
button.tile{cursor:pointer}
button.tile.on{outline:2px solid var(--mr)}
.wave{display:block;width:100%;height:46px;margin-top:14px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.pl{flex:none;border:0;border-radius:99px;background:var(--cd);color:var(--ink);padding:9px 16px;font:600 15px "Baloo 2",sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(110,15,34,.1)}
.pl.on{background:var(--mr);color:#fff}
.cat h2{font-size:22px;margin:14px 2px 8px}
.cat h2 small{font:400 13px "Be Vietnam Pro";color:var(--mut);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.cd{background:var(--cd);border-radius:22px;padding:10px 10px 14px;text-align:center;box-shadow:0 2px 10px rgba(110,15,34,.07);display:flex;flex-direction:column}
.im{position:relative;aspect-ratio:4/5;border-radius:16px;display:grid;place-items:center;font-size:64px;margin-bottom:10px}
.bd{position:absolute;top:8px;left:8px;background:#ffd45c;color:#5a3b00;border-radius:99px;font:700 12px "Baloo 2",sans-serif;padding:0 10px}
.cd h3{font-size:17px;line-height:1.2;font-weight:700;min-height:41px;display:grid;place-items:center}
.cd p{margin:2px 0 8px;color:var(--mut);font-size:12px}
.pp{align-self:center;background:var(--pk);color:var(--mr);border-radius:99px;padding:1px 12px;font:700 13px "Baloo 2",sans-serif;margin-bottom:10px}
:root[data-theme="dark"] .pp{color:#ffb3c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pp{color:#ffb3c0}}
.bt{margin-top:auto;border:0;border-radius:99px;background:var(--mr);color:#fff;padding:9px;font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:var(--cd);border-radius:18px;padding:14px;font-size:14px}
.tp div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--ln);padding:3px 0}
.foot{padding:26px 0 10px;color:var(--mut);font-size:13px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:8;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;border:0;border-radius:99px;background:var(--mr);color:#fff;padding:14px 22px;font:600 15px "Be Vietnam Pro",sans-serif;cursor:pointer;box-shadow:0 6px 16px rgba(110,15,34,.3)}
.btn[disabled]{opacity:.5;box-shadow:none}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}
#gate .gtop{height:300px;background:var(--mr);border-radius:0 0 36px 36px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 20px 50px;text-align:center}
#gate .glogo{width:76px;height:76px;border-radius:22px;background:#8d1a31;border:3px solid rgba(255,255,255,.9);display:grid;place-items:center;font-size:38px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#gate .glogo img{width:100%;height:100%;object-fit:cover}
#gate h2{font:700 30px/1.1 "Baloo 2",sans-serif;margin:4px 0 0}#gate .gtop p{margin:0;opacity:.85;font-size:14px}
#gate .gcard{max-width:420px;margin:-70px auto 30px;background:var(--cd);border-radius:26px;padding:22px 18px;box-shadow:0 14px 34px rgba(60,20,25,.14);width:calc(100% - 36px)}
#gate .gseg{display:flex;background:var(--pk);border-radius:99px;padding:4px;margin-bottom:18px}#gate .gseg button{flex:1;border:0;background:none;padding:10px;border-radius:99px;font:600 15px "Be Vietnam Pro",sans-serif;color:var(--mr);cursor:pointer}#gate .gseg button.on{background:var(--cd);box-shadow:0 2px 8px rgba(110,15,34,.15)}
#gate .glb{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 6px}
#gate input.gi{background:var(--bg);border-radius:14px;padding:13px 14px;margin-bottom:12px}
#gate .gpin{position:relative;display:flex;gap:10px;margin-bottom:14px}#gate .gpin div{flex:1;height:56px;border:1.5px solid var(--ln);background:var(--bg);border-radius:14px;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--mr);transition:border-color .15s}#gate .gpin div.f,#gate .gpin div.cur{border-color:var(--mr)}
#gate .gpin input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;font-size:16px;caret-color:transparent}
#gerr{color:var(--mr);font-size:14px;min-height:20px;margin:0 0 8px;text-align:center}
#gate .gfg{display:block;margin:14px auto 0;border:0;background:none;color:var(--mr);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #gate .gseg button{color:var(--ink)}:root:not([data-theme="light"]) #gate .gseg button.on{background:var(--mr);color:#fff}:root:not([data-theme="light"]) #gate .gfg,:root:not([data-theme="light"]) #gerr,:root:not([data-theme="light"]) #gerr a{color:#ffb3c0!important}:root:not([data-theme="light"]) #gate .gpin div{color:#ffb3c0}:root:not([data-theme="light"]) #gate .gpin div.f,#gate .gpin div.cur{border-color:#ffb3c0}}
:root[data-theme="dark"] #gate .gseg button{color:var(--ink)}:root[data-theme="dark"] #gate .gseg button.on{background:var(--mr);color:#fff}:root[data-theme="dark"] #gate .gfg,:root[data-theme="dark"] #gerr,:root[data-theme="dark"] #gerr a{color:#ffb3c0!important}:root[data-theme="dark"] #gate .gpin div{color:#ffb3c0}:root[data-theme="dark"] #gate .gpin div.f,#gate .gpin div.cur{border-color:#ffb3c0}
.mo{display:block;margin:0 auto 8px;border:1.5px solid var(--mr);border-radius:99px;background:var(--cd);color:var(--mr);padding:7px 16px;font:600 13px "Be Vietnam Pro",sans-serif;cursor:pointer}
.mi{background:var(--cd);border-radius:14px;padding:12px;margin:10px 0}.mi .mh{display:flex;justify-content:space-between;gap:8px;font-weight:600}.mi small{color:var(--mut);font-weight:500}.mi pre{background:var(--bg)}
.ov{position:fixed;inset:0;background:rgba(30,10,14,.5);z-index:20;display:none;align-items:flex-end}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}html{scroll-behavior:auto}}
.sheet h3{font-size:26px}
.lb{margin:16px 0 6px;font-weight:600;font-size:13px;color:var(--mut)}
.ch{display:flex;flex-wrap:wrap;gap:7px}
.ch button{border:1.5px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.ch button.on{border-color:var(--mr);background:var(--mr);color:#fff}
input,textarea{width:100%;border:1.5px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:8px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--mr);outline-offset:2px}
.q{display:flex;align-items:center;gap:14px}
.q button{width:36px;height:36px;border-radius:50%;border:0;background:var(--pk);color:var(--mr);font-size:20px;cursor:pointer}
:root[data-theme="dark"] .q button{color:#ffb3c0}
.ln{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.ln div:first-child{flex:1}.ln small{color:var(--mut);display:block}
.ln button{border:0;background:none;color:var(--mr);cursor:pointer;font:inherit;font-size:13px}
.who{font:700 17px "Baloo 2",sans-serif;margin-top:14px;display:flex;justify-content:space-between;color:var(--mr)}
.tot{display:flex;justify-content:space-between;font:700 24px "Baloo 2",sans-serif;margin:16px 0}
.qr{border:1.5px dashed var(--mut);border-radius:14px;padding:18px;text-align:center;color:var(--mut);font-size:13px;margin:8px 0 14px}
pre{white-space:pre-wrap;background:var(--cd);border-radius:12px;padding:12px;font:13px/1.5 "Be Vietnam Pro",sans-serif;margin:10px 0}
.sec2{display:flex;gap:8px}.sec2 .btn{justify-content:center;text-decoration:none;box-shadow:none}
.btn.o{background:none;color:var(--mr);border:1.5px solid var(--mr);box-shadow:none}
.logo img,.im img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.im img{position:absolute;inset:0;border-radius:16px}
.adm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9;border:0;border-radius:99px;background:var(--ink);color:var(--bg);padding:7px 14px;font:600 13px "Be Vietnam Pro",sans-serif;cursor:pointer}
.bt[disabled]{opacity:.45;cursor:default}
input[type=file]{padding:9px}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{to{transform:scale(1.18);opacity:.8}}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes rise{from{opacity:.9}to{transform:translateY(-110vh);opacity:0}}
.lights{display:none;justify-content:space-around;position:relative;height:34px;padding:0 6px;pointer-events:none}
.lights::before{content:"";position:absolute;left:-2%;right:-2%;top:0;height:10px;border-bottom:2px solid #3f6b50;border-radius:0 0 50% 50%/0 0 100% 100%}
.lights i{display:block;width:10px;height:15px;margin-top:8px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 10px 2px var(--c);animation:tw 1.5s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.27s)}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.tree{text-align:center;margin:16px 0 4px;background:var(--cd);border-radius:20px;padding:14px 10px 10px}
.tt{font:600 14px "Baloo 2",sans-serif;color:var(--mut);margin-bottom:6px}
.star{width:30px;height:30px;display:block;margin:0 auto -2px;cursor:pointer}
.star.lit{filter:drop-shadow(0 0 8px #ffd45c);animation:pulse2 1s ease-in-out infinite alternate}
.tr{display:flex;justify-content:center;gap:6px}
.cp{width:36px;height:48px;cursor:pointer;opacity:.7;transition:transform .15s,opacity .15s}
.cp:active{transform:scale(.88)}
.cp.lit{opacity:1;filter:drop-shadow(0 0 7px currentColor);animation:pulse2 1.2s ease-in-out infinite alternate}
.trunk{width:22px;height:12px;background:#8a5a3c;margin:0 auto;border-radius:0 0 4px 4px}
.tmsg{min-height:20px;margin-top:8px;font-size:14px;color:var(--mr);font-weight:600}
@keyframes pulse2{to{transform:scale(1.08)}}
.gift{display:flex;align-items:center;gap:10px;width:100%;border:2px dashed var(--mr);border-radius:16px;background:var(--pk);color:var(--ink);padding:14px;font:600 15px "Be Vietnam Pro",sans-serif;margin:12px 0 0;cursor:pointer;text-align:left}
.gift.open{border-style:solid;cursor:default}
.gift.shake{animation:shake .7s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.stripe{display:none;height:10px;background:repeating-linear-gradient(135deg,#C62A3A 0 8px,#FFFFFF 8px 16px)}
:root[data-season="noel"] .stripe{display:block}
:root[data-season="noel"] .wave{display:none}
:root[data-season="noel"] .top h1{color:var(--mr)}
:root[data-season="noel"] .tile.hl{background:#2E7D5B}
:root[data-season="noel"]{--bg:#F4FAF6;--cd:#FFFFFF;--ink:#2B3A33;--mut:#66796f;--ln:#d8e8de;--mr:#C62A3A;--pk:#FCE4E6;--sky:#FFFFFF;--sage:#CDEBDD;color-scheme:light}
:root[data-season="noel"] .pp{color:#B02433}
:root[data-season="noel"] .im{background:#CDEBDD!important}
@media (prefers-reduced-motion:reduce){.lights i,.cp,.star,.gift{animation:none!important}}
.gift{flex-wrap:wrap}.gift small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.gk{border:0;border-radius:99px;background:var(--mr);color:#fff;padding:8px 16px;font:600 13px "Be Vietnam Pro",sans-serif;cursor:pointer}
.gk.o{background:none;color:var(--mr);border:1.5px solid var(--mr)}

/* ===== Thẻ tích điểm (mua 10 ly tặng 1 ly) ===== */
.sbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;border:0;border-radius:16px;padding:10px 14px;background:#FFF3DC;color:#14213D;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sbar svg{width:22px;height:22px;color:#E3342F;flex:none}
.sbar .pb{flex:1;height:9px;border-radius:99px;background:#EADCC2;overflow:hidden}.sbar .pb i{display:block;height:100%;border-radius:99px;background:#E3342F}
.sbar.full{background:#E3342F;color:#FFF3DC}.sbar.full svg{color:#FFF3DC}
.mcard{width:100%;max-width:380px;margin:6px auto 4px;aspect-ratio:85.6/54;border-radius:18px;position:relative;overflow:hidden;color:var(--ctx);background:var(--cbg);display:grid;grid-template-rows:auto 1fr auto;padding:5.5% 6% 5%;box-shadow:0 1px 1px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.08),0 16px 28px -10px rgba(60,20,20,.4)}
.mcard:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 30%,rgba(255,255,255,0) 50%,rgba(255,255,255,.08));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);pointer-events:none}
.mcard>*{position:relative;z-index:1}
.mcard .mct{display:flex;align-items:center}
.mcard .mct b{font:400 clamp(18px,5.6vw,23px)/1 "Coiny","Baloo 2",sans-serif;color:var(--clogo);text-shadow:var(--clsh)}
.mcard .mct span{margin-left:auto;font-weight:700;font-size:9px;letter-spacing:2px;opacity:.72}
.mcard .mcp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7% 6%;width:58%;align-self:center}
.mcard .mcp i{min-width:0;min-height:0;overflow:hidden;line-height:0;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--cslot);box-shadow:inset 0 0 0 1.6px var(--cline)}
.mcard .mcp i svg{width:70%;height:70%;color:var(--cpaw)}
.mcard .mcp i.on{background:var(--con);box-shadow:none}
.mcard .mcp i:nth-child(odd) svg{transform:rotate(-14deg)}.mcard .mcp i:nth-child(even) svg{transform:rotate(12deg)}
.mcard .mcp i.gft{box-shadow:inset 0 0 0 1.6px var(--cacc)}.mcard .mcp i.gft b{font-size:11px;line-height:1;display:block}
.mcard .mcb small{display:block;font-weight:700;font-size:8px;letter-spacing:1.6px;opacity:.68;margin-bottom:3px}
.mcard .mcb .nm{font-weight:700;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;line-height:1.15}
.mcard .mcb .ph{font-weight:600;font-size:11px;letter-spacing:1.8px;opacity:.85;margin-top:2px}
.mcard .mcn{position:absolute;right:6%;top:24%;z-index:2;text-align:center;background:var(--cnb);color:var(--cnt);border-radius:12px;padding:5px 9px;font-weight:700;font-size:10px;line-height:1.15}
.mcard .mcn b{display:block;font-size:19px;line-height:1}
.mcard .mcr{position:absolute;right:6%;top:22%;z-index:2;background:var(--cacc);color:#FFF3DC;border-radius:12px;padding:6px 10px;font-weight:700;font-size:11px;line-height:1.15;text-align:center;transform:rotate(4deg);box-shadow:0 0 0 2px var(--cedge),0 6px 12px rgba(0,0,0,.2)}
.mcard .mcr b{display:block;font-size:16px}
.mcard .cat{position:absolute;right:-3%;bottom:-9%;width:42%;aspect-ratio:1;z-index:1}
.mc-kem{--cbg:linear-gradient(135deg,#FFF6E4,#F4E2C2);--ctx:#14213D;--clogo:#1F63C9;--clsh:1.5px 1.5px 0 #14110F;--cslot:rgba(31,99,201,.06);--cline:rgba(31,99,201,.28);--con:#1F63C9;--cpaw:#FFF3DC;--cacc:#E3342F;--cnb:#1F63C9;--cnt:#FFF3DC;--cedge:#F4E2C2}
.mc-do{--cbg:linear-gradient(135deg,#E5473F,#C9332D);--ctx:#FFF3DC;--clogo:#FFF3DC;--clsh:2px 2px 0 #14110F;--cslot:rgba(255,243,220,.12);--cline:rgba(255,243,220,.4);--con:#FFF3DC;--cpaw:#C9332D;--cacc:#14213D;--cnb:#FFF3DC;--cnt:#C9332D;--cedge:#C9332D}
.mch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mcdots{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:600}
.mcdots button{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.mcdots button.kem{background:linear-gradient(135deg,#FFF6E4,#F4E2C2)}.mcdots button.do{background:linear-gradient(135deg,#E5473F,#C9332D)}
.mcdots button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #14213D}
.mchint{text-align:center;font-size:14px;margin:12px 0 2px;color:var(--ink)}.mchint b{color:#E3342F}
.mcrule{text-align:center;font-size:12px;color:var(--mut);margin:0 0 14px}
.slogb{background:var(--cd);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.slt{font-weight:700;font-size:14px;margin-bottom:4px}
.sle{font-size:13px;color:var(--mut)}
.slog{display:grid;gap:0;font-size:13px}.slog div{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--ln);padding:6px 0}.slog div:first-child{border-top:0}.slog i{font-style:normal;font-weight:700;color:#2E7D5B}.slog i.u{color:#E3342F}
.myh{margin-top:18px;padding-top:16px;border-top:1.5px solid var(--ln)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:31;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}

if(GREG&&$('gpin2').value.trim()!==pin){er.textContent='Hai lần nhập mã PIN không khớp.';$('gpin2').focus();return}
er.textContent='Đang xử lý…';$('gbtn').disabled=true;
fetch('/api/my',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(GREG?{action:'register',name:nm,phone:ph,pin:pin}:{phone:ph,pin:pin})}).then(function(r){return r.json().catch(function(){return {err:'Lỗi máy chủ'}}).then(function(d){$('gbtn').disabled=false;if(!r.ok){er.textContent=d.err||'Không thành công';return}
meSet({ph:ph,pin:pin,name:d.name||nm,stamps:+d.stamps||0});sbarDraw();gTab(0);gHide()})}).catch(function(){$('gbtn').disabled=false;er.textContent='Không kết nối được, thử lại sau.'})}
// Mở web: chưa đăng nhập thì hiện màn hình đăng nhập; đã đăng nhập thì kiểm tra lại ngầm
function gInit(){if(location.hash==='#admin')return;var me=meGet();if(!me.ph||!me.pin)return gShow('');
fetch('/api/my',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:me.ph,pin:me.pin}),cache:'no-store'}).then(function(r){if(r.status===403||r.status===429)return r.json().catch(function(){return {}}).then(function(d){meSet(null);gShow(d.err||'Hãy đăng nhập lại.')});if(r.ok)return r.json().then(function(d){if(d.name)me.name=d.name;if(d.stamps!=null)me.stamps=d.stamps;meSet(me);sbarDraw()})}).catch(function(){})}
function copyMsg(b){
  var ok=function(){b.textContent='Đã sao chép'};
  try{navigator.clipboard.writeText(done).then(ok,fb)}catch(e){fb()}
  function fb(){var r=document.createRange();r.selectNodeContents($('msg'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');ok()}catch(e){}}
}
var PW='';try{PW=localStorage.getItem('pw')||''}catch(e){}
build();upd();myBtn();gInit();
if(location.hash==='#admin')$('adm').style.display='';
fetch('/api/config').then(function(r){return r.ok?r.json():{}}).then(function(d){if(d&&d.cats){CFG=norm(d);syncTops();build()}}).catch(function(){});
function cartQty(){return cart.reduce(function(a,l){return a+l.qty},0)}
function applySeason(){
  var n=CFG.info.season==='noel';
  document.documentElement.setAttribute('data-season',n?'noel':'');
  $('lights').style.display=n?'flex':'none';$('tree').style.display=n?'block':'none';
  if(n&&!$('lights').firstChild)buildLights();
  if(n&&!$('tree').firstChild)buildTree();
}
function buildLights(){var C=['#C62A3A','#2E7D5B','#E8B84A','#2E7D5B'],h='';for(var i=0;i<16;i++)h+='<i style="--c:'+C[i%4]+';--i:'+i+'"></i>';$('lights').innerHTML=h}
function buildTree(){
  var C=['#c0392b','#2e7d4f','#d4a017'],n=0,h='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="cupy" viewBox="0 0 30 40"><path d="M4 9H26L23 38H7Z" fill="currentColor"/><rect x="2" y="4" width="26" height="6" rx="3" fill="#fffaf6"/><rect x="14" y="0" width="2.5" height="6" fill="#fffaf6"/></symbol></defs></svg><div class="tt">Cây thông trà · chạm vào ly để bật đèn</div><svg class="star" id="star" onclick="litAll()" viewBox="0 0 24 24" aria-label="Ngôi sao"><path d="M12 1l3 7 7.5.6-5.7 5 1.8 7.4L12 17l-6.6 4 1.8-7.4-5.7-5L9 8z" fill="#ffd45c"/></svg>';
  for(var r=1;r<=4;r++){h+='<div class="tr">';for(var j=0;j<r;j++){h+='<svg class="cp" viewBox="0 0 30 40" style="color:'+C[n%3]+'" onclick="this.classList.toggle(\'lit\');chk()"><use href="#cupy"/></svg>';n++}h+='</div>'}
  $('tree').innerHTML=h+'<div class="trunk"></div><div class="tmsg" id="tmsg"></div>';
}
function chk(){var a=document.querySelectorAll('.cp').length,l=document.querySelectorAll('.cp.lit').length,all=a===l;$('star').setAttribute('class','star'+(all?' lit':''));$('tmsg').textContent=all?'Cây sáng đèn rồi! Chúc bạn Giáng sinh vui vẻ 🎄':''}
function litAll(){[].forEach.call(document.querySelectorAll('.cp'),function(c){c.classList.add('lit')});chk()}
var giftG=null,giftUse=null,giftSaved=0;
function giftReset(){giftG=null;giftUse=null;giftSaved=0}
function gList(){var g=CFG.info.gifts;return Array.isArray(g)?g:[]}
function savedGift(){try{var g=JSON.parse(localStorage.getItem('gift')||'null');if(g&&g.exp>Date.now())return g}catch(e){}return null}
function putGift(g){try{localStorage.setItem('gift',JSON.stringify(g))}catch(e){}}
function dropGift(){try{localStorage.removeItem('gift')}catch(e){}}
function sub(){return cart.reduce(function(a,l){return a+lineTotal(l)},0)}
function disc(){return giftUse&&giftUse.t==='sub'?Math.min(giftUse.v,sub()):0}
function hanStr(g){return new Date(g.exp).toLocaleDateString('vi-VN')}
function giftHtml(){
  if(CFG.info.season!=='noel')return '';
  var sv=savedGift();
  if(giftUse)return '<div class="gift open">🎁<span style="flex:1"><b>'+esc(giftUse.n)+'</b><small>'+(giftUse.t==='sub'?'Đã trừ '+fmt(disc())+' vào đơn':'Tặng kèm, quán gửi cùng đơn của bạn')+'</small></span>'+(giftUse.fromSaved?'<button class="gk o" onclick="giftBack()">Không dùng</button>':'')+'</div>';
  if(giftG)return '<div class="gift open">🎁<span style="flex:1">Bạn nhận được: <b>'+esc(giftG.n)+'</b></span><div style="display:flex;gap:8px;width:100%"><button class="gk" onclick="giftChoose(1)">Dùng luôn</button><button class="gk o" onclick="giftChoose(0)">Để lần sau</button></div></div>';
  if(sv&&giftSaved)return '<div class="gift open">🎁<span><b>'+esc(sv.n)+'</b><small>Đã lưu cho lần sau, hạn đến '+hanStr(sv)+'. Lần tới mở web sẽ thấy trong giỏ.</small></span></div>';
  if(sv)return '<div class="gift open">🎁<span style="flex:1">Quà đã lưu: <b>'+esc(sv.n)+'</b><small>Hạn đến '+hanStr(sv)+'</small></span><button class="gk" onclick="giftUseSaved()">Dùng cho đơn này</button></div>';
  if(cartQty()<2)return '<p style="font-size:13px;color:var(--mut);margin:12px 0 0">🎁 Đặt từ 2 ly để nhận hộp quà bí mật</p>';
  return '<button class="gift" onclick="openGift(this)">🎁 <span>Bạn có 1 hộp quà bí mật, bấm để mở</span></button>';
}
function openGift(b){var L=gList();if(!L.length)return;b.className='gift shake';setTimeout(function(){giftG=L[Math.floor(Math.random()*L.length)];refreshGift()},700)}
function giftChoose(now){var g=Object.assign({},giftG);giftG=null;if(now)giftUse=g;else{g.exp=Date.now()+30*864e5;putGift(g);giftSaved=1}refreshGift()}
function giftUseSaved(){var g=savedGift();if(g){g.fromSaved=1;giftUse=g;refreshGift()}}
function giftBack(){giftUse=null;refreshGift()}
function refreshGift(){
  var K=['nm','ph','ad','nt'],v={};K.forEach(function(k){if($(k))v[k]=$(k).value});
  var d=delivery,sf=selfShip,c=$('pd')&&$('pd').checked;
  openCart();
  K.forEach(function(k){if(v[k]!=null&&$(k))$(k).value=v[k]});
  if(d)ship(1);else if(sf)ship(2);if(c&&$('pd'))$('pd').checked=true;
  var g=document.querySelector('.gift');if(g&&g.scrollIntoView)g.scrollIntoView({block:'center'});
}
function adGifts(){
  var g=CFG.info.gifts,h='<div class="lb">Quà hộp bí mật (khách mở ngẫu nhiên một phần)</div>';
  if(!Array.isArray(g))return h;
  g.forEach(function(x,i){
    h+='<div class="ln" style="align-items:center;flex-wrap:wrap"><input style="margin:0;flex:1 1 140px" value="'+esc(x.n)+'" onchange="CFG.info.gifts['+i+'].n=this.value;save()"><div class="ch"><button class="'+(x.t==='sub'?'on':'')+'" onclick="CFG.info.gifts['+i+'].t=\'sub\';save();drawAdmin()">Trừ tiền</button><button class="'+(x.t==='free'?'on':'')+'" onclick="CFG.info.gifts['+i+'].t=\'free\';save();drawAdmin()">Tặng kèm</button></div>'+(x.t==='sub'?'<input type="number" inputmode="numeric" style="margin:0;width:70px" value="'+x.v+'" onchange="CFG.info.gifts['+i+'].v=+this.value||0;save()"><small>k</small>':'')+'<button onclick="CFG.info.gifts.splice('+i+',1);save();drawAdmin()">Xóa</button></div>';
  });
  return h+'<button class="btn o" style="margin-top:10px;justify-content:center" onclick="CFG.info.gifts.push({n:\'Giảm 5k\',t:\'sub\',v:5});save();drawAdmin()">+ Thêm quà</button>';
}
function setSeason(v){CFG.info.season=v;save();drawAdmin()}
</script>
</body>
</html>
