<style>
:root{

  --blue:#1F63C9;--blue2:#3B7BD8;--cream:#FFF3DC;--soft:#DCE8F8;--red:#E3342F;--black:#14110F;

*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink);font:16px/1.4 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);min-height:100vh}
body.alert{animation:fl 1s infinite}@keyframes fl{0%,100%{background:#1F63C9}50%{background:#B4231F}}

header{position:sticky;top:0;z-index:5;margin:10px 10px 0;background:var(--cream);border-radius:18px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(20,17,15,.18)}
header h1{display:flex;align-items:center;gap:8px;font:400 22px/1 var(--disp);color:var(--blue);text-shadow:1.5px 1.5px 0 var(--black);margin:0 6px 0 0;flex:1 1 auto;white-space:nowrap}
header h1 svg{width:42px;height:42px;border-radius:50%;background:var(--blue);padding:2px;flex:none}
.pill{padding:6px 11px;border-radius:99px;background:#F4E6C8;font-weight:800;font-size:13px}
#pn{background:var(--red);color:var(--cream)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--black);color:#fff;font-weight:800}
button:focus-visible{outline:3px solid var(--black);outline-offset:2px}
header button.g{background:var(--blue2);color:var(--cream);border:0;box-shadow:none;padding:8px 11px;font-size:13.5px}
@media(max-width:600px){header button.g{font-size:12.5px;padding:7px 9px}}
button.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
button.big{width:100%;padding:16px;font-size:18px}
.rd{background:var(--red)}.gr{background:var(--ok)}.am{background:var(--wa)}
#bn{display:none;background:var(--black);color:var(--cream);padding:10px 14px;text-align:center;font-weight:800;margin:10px 10px 0;border-radius:14px}
#al{display:none;margin:10px 10px 0;background:var(--red);color:var(--cream);border-radius:20px;padding:10px 14px;align-items:center;gap:12px;box-shadow:0 0 0 3px var(--black);animation:pulse 1s infinite}
#al svg{width:72px;height:72px;flex:none}
#al b{display:block;font:400 26px/1.05 var(--disp)}
#al span{font-weight:700}
@keyframes pulse{50%{transform:scale(1.015);box-shadow:0 0 0 3px var(--black),0 0 0 10px rgba(255,243,220,.35)}}
.tabs{display:flex;gap:4px;margin:10px 10px 0;background:rgba(255,243,220,.16);border-radius:14px;padding:4px}.tabs button{flex:1;background:transparent;color:var(--cream);padding:9px 4px;font-size:14px}.tabs button.on{background:var(--cream);color:var(--blue)}
.cols{display:grid;gap:10px;padding:10px;grid-template-columns:1fr}
.col{display:none}.col.cur{display:block}
@media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr)}.col{display:block;background:rgba(255,243,220,.12);border-radius:18px;padding:10px;align-self:start}.tabs{display:none}}
.col h2{display:flex;align-items:center;gap:8px;font:400 19px/1 var(--disp);margin:0 0 10px;color:var(--cream)}
.col h2 svg{width:40px;height:40px}
.col h2 i{font:800 13px "Nunito",sans-serif;font-style:normal;background:var(--cream);color:var(--blue);border-radius:99px;padding:2px 9px}
.o{background:var(--cd);border:0;border-radius:18px;padding:12px;margin-bottom:10px}
.o.n{box-shadow:0 0 0 3px var(--red)}
.oh{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.oh a{color:var(--blue)}
.oh small{font-weight:600;color:var(--mut)}
.ship{background:#F4ECDD;border-radius:12px;padding:10px;margin:0 0 8px;font-size:14px;display:grid;gap:8px}
.mapl{flex:1;text-align:center;text-decoration:none;border:0;box-shadow:inset 0 0 0 1.5px var(--ln);background:#fff;color:var(--ink);border-radius:10px;padding:9px 6px;font-weight:800;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:#F4ECDD;border-radius:12px;padding:10px;margin:8px 0}
.row{display:flex;gap:8px}.row button{flex:1}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cd);border:0;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.it.off{opacity:.65}
#lg{max-width:360px;margin:18vh auto 0;padding:64px 20px 20px;background:var(--cd);border-radius:24px;position:relative;text-align:center}
#lg>svg{position:absolute;left:50%;top:-64px;transform:translateX(-50%);width:124px;height:124px}
#lg h2{font:400 26px/1.1 var(--disp);color:var(--blue);text-shadow:1.5px 1.5px 0 var(--black)}
#lg .big{background:var(--red)}
#lg input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;font:inherit;margin:10px 0}
.em{color:var(--cream);opacity:.85;text-align:center;padding:18px;font-weight:700}
#un{box-shadow:0 0 0 2px var(--black)}
#stock .em{color:var(--ink)}
#stock{margin:10px;background:var(--cream);border-radius:18px}
</style></head><body>

<div id="lg"><svg aria-hidden="true"><use href="#p-peek"/></svg><h2 style="margin:0">Quản lý đơn · O Sugar</h2><p style="color:var(--mut);margin:6px 0 0">Bấm vào đây một lần để bật chuông.</p><div id="le" style="color:var(--mr);margin-top:8px"></div><input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password"><button class="big" onclick="login()">Vào</button></div>

<header><h1><svg aria-hidden="true"><use href="#p-hug"/></svg>O Sugar · Đơn</h1><span class="pill" id="pn">0 chờ</span><span class="pill" id="rv"></span><span class="pill" id="up" style="font-weight:500"></span><span class="pill" id="gp" style="display:none;background:#ffe3a3"></span><button class="g" onclick="poll()">🔄 Tải lại</button><button class="g" id="nb" onclick="pp()">🔔 Thông báo: Chưa bật</button><button class="g" id="mb" onclick="mute()">🔔 Chuông: Bật</button><button class="g" id="vb" onclick="view()">Hết món</button><button class="g" onclick="pinReset()">🔑 Đặt lại PIN khách</button></header>
<div id="un" style="display:none;margin:10px 10px 0;background:#FDECC8;border-radius:16px;padding:10px 12px"></div><div id="orders"><div class="tabs"><button onclick="tab('new')" id="t_new">Mới</button><button onclick="tab('doing')" id="t_doing">Đang làm</button><button onclick="tab('done')" id="t_done">Xong</button></div>

</div>
<div id="pp" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto"><h3 style="margin:0 0 8px">Thông báo đẩy</h3><div id="ppb"></div><div class="row" style="margin-top:12px"><button class="rd" onclick="ppEnable()">Bật / đăng ký lại</button><button class="gr" onclick="ppTest()">Gửi thử</button></div><button class="g big" style="margin-top:8px;padding:10px" onclick="ppClose()">Đóng</button></div></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.t==='poll'&&PW)poll();if(e.data&&e.data.t==='mute'&&!muted)mute()})}
['focus','pageshow','online'].forEach(function(ev){window.addEventListener(ev,function(){if(PW&&$('app').style.display!=='none')poll()})});
var LP=0,LS={},PW='',O=[],CFG=null,cur='new',muted=false,AC=null,ringT=null,fails=0,wl=null,showStock=false,first=true;
try{PW=localStorage.getItem('pw')||''}catch(e){}
var $=function(i){return document.getElementById(i)};
var fmt=function(k){return (k*1000).toLocaleString('vi-VN')+'đ'};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var VB=null,VL=0;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();loadVoice()}catch(e){}}
function loadVoice(){if(VB||VL||!AC)return;VL=1;fetch('/don-moi.mp3').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(b){return new Promise(function(ok,no){var p=AC.decodeAudioData(b,ok,no);if(p&&p.then)p.then(ok,no)})}).then(function(x){VB=x}).catch(function(){VL=0})}
function say(){if(VB){var s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1;s.buffer=VB;s.connect(g);g.connect(AC.destination);s.start();return true}
try{if(window.speechSynthesis){var v=speechSynthesis.getVoices().filter(function(x){return /^vi/i.test(x.lang)})[0];if(v){var u=new SpeechSynthesisUtterance('Có đơn hàng mới. Có đơn hàng mới.');u.voice=v;u.lang=v.lang;u.rate=1;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u);return true}}}catch(e){}return false}
document.addEventListener('click',audio);document.addEventListener('touchstart',audio);
function beep(){if(!AC||AC.state!=='running')return;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}if(say())return;var t=AC.currentTime;[[880,0],[660,.22],[880,.44]].forEach(function(x){var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=x[0];g.gain.setValueAtTime(0,t+x[1]);g.gain.linearRampToValueAtTime(.35,t+x[1]+.02);g.gain.linearRampToValueAtTime(0,t+x[1]+.18);o.connect(g);g.connect(AC.destination);o.start(t+x[1]);o.stop(t+x[1]+.2)});try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
var ringOn=false,lastBeep=0,TK=0,busy=0;function ring(on){if(on&&!ringOn){ringOn=true;lastBeep=Date.now();beep()}else if(!on)ringOn=false}
function tick(){TK++;if(ringOn&&Date.now()-lastBeep>=(VB?4000:1800)){lastBeep=Date.now();beep()}if(TK%2===0&&AC&&AC.state!=='running'&&O.some(function(o){return o.s==='new'}))bn('Chạm vào màn hình để bật chuông')}
function mkTick(){try{var b=new Blob(['setInterval(function(){postMessage(1)},1000)'],{type:'text/javascript'}),w=new Worker(URL.createObjectURL(b));w.onmessage=tick}catch(e){setInterval(tick,1000)}}
function mute(){muted=!muted;$('mb').textContent='🔔 Chuông: '+(muted?'Tắt':'Bật');upd()}
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&PW){wake();poll();audio()}});
function login(){var p=$('pw').value.trim();audio();fetch('/api/orders',{headers:{'x-admin':p}}).then(function(r){if(r.ok){PW=p;try{localStorage.setItem('pw',p)}catch(e){}start()}else $('le').textContent='Sai mật khẩu ('+r.status+')'}).catch(function(){$('le').textContent='Không kết nối được'})}
// Lưu mật khẩu vào IndexedDB để thông báo đẩy (sw.js) lấy được tóm tắt đơn mới nhất
function idbPw(v){try{var rq=indexedDB.open('osugar',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('kv')};rq.onsuccess=function(){try{var st=rq.result.transaction('kv','readwrite').objectStore('kv');if(v)st.put(v,'pw');else st.delete('pw')}catch(e){}}}catch(e){}}
function start(){idbPw(PW);$('lg').style.display='none';$('app').style.display='';wake();ppRefresh();poll();mkTick();try{if(navigator.locks)navigator.locks.request('don-keepalive',function(){return new Promise(function(){})})}catch(e){}}
function bn(t){var b=$('bn');b.textContent=t;b.style.display=t?'block':'none'}
function poll(){if(busy&&Date.now()-busy<15000)return;busy=Date.now();poll0().then(function(){busy=0},function(){busy=0})}
function poll0(){return fetch('/api/orders',{headers:{'x-admin':PW},cache:'no-store'}).then(function(r){if(r.status===401){PW='';idbPw('');try{localStorage.removeItem('pw')}catch(e){}location.reload();return null}return r.json()}).then(function(d){if(!d)return;var nw=Date.now();LP=nw;fails=0;$('up').textContent='Cập nhật '+new Date(nw).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});if(AC&&AC.state==='running'&&$('bn').textContent.indexOf('Chạm')===0)bn('');O=d.orders||[];drawUn(d.unmatched||[]);O.forEach(function(o){var l=LS[o.id];if(l&&Date.now()-l.t<15000)o.s=l.s});draw()}).catch(function(){fails++;if(fails>=2)bn('Mất kết nối mạng, đang thử lại…')})}

function b2u(b){var s=(b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function inApp(){return navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function pSup(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
var ppMsg='';
function ppShow(rows){var h=rows.map(function(r){return '<div style="margin:6px 0">'+(r[0]?'✅ ':'❌ ')+esc(r[1])+(r[2]?'<br><small style="color:var(--mut)">'+esc(r[2])+'</small>':'')+'</div>'}).join('');h+='<div style="margin-top:10px;font-weight:600;white-space:pre-wrap">'+esc(ppMsg)+'</div>';$('ppb').innerHTML=h}
function pp(){$('pp').style.display='flex';ppMsg='';ppCheck()}
function ppClose(){$('pp').style.display='none'}
function ppCheck(){var rows=[],sup=pSup();rows.push([sup,'Máy hỗ trợ thông báo đẩy',sup?'':(isIOS()&&!inApp()?'Trên iPhone/iPad: bấm nút chia sẻ của Safari, chọn Thêm vào MH chính, rồi mở app từ icon ngoài màn hình chính.':'Trình duyệt này không hỗ trợ.')]);if(!sup){ppShow(rows);return}
var perm=Notification.permission;rows.push([perm==='granted','Quyền thông báo: '+({granted:'đã cho phép',denied:'đang bị chặn',default:'chưa cấp'}[perm]||perm),perm==='denied'?'Mở cài đặt trình duyệt hoặc máy, cho phép thông báo cho trang này rồi bấm Bật lại.':(perm==='default'?'Bấm Bật / đăng ký lại và chọn Cho phép.':'')]);
navigator.serviceWorker.getRegistration().then(function(reg){return reg?reg.pushManager.getSubscription():null}).then(function(s){rows.push([!!s,'Máy này đã đăng ký nhận thông báo',s?'':'Bấm Bật / đăng ký lại.']);ppShow(rows)}).catch(function(){ppShow(rows)})}
function ppSub(){return navigator.serviceWorker.ready.then(function(reg){return fetch('/api/push',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('lấy khóa lỗi '+r.status);return r.json()}).then(function(d){var key=b2u(d.key);return reg.pushManager.getSubscription().then(function(s){if(s&&s.options&&s.options.applicationServerKey){var cur=new Uint8Array(s.options.applicationServerKey);var same=cur.length===key.length&&cur.every(function(v,i){return v===key[i]});if(!same)return s.unsubscribe().then(function(){return null})}return s}).then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key})})})}).then(function(s){return fetch('/api/push',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).then(function(r){if(!r.ok)throw new Error('máy chủ từ chối lưu ('+r.status+')');$('nb').textContent='🔔 Thông báo: Bật'})})}
function ppEnable(){audio();if(!pSup()){ppCheck();return}ppMsg='Đang bật…';ppCheck();Notification.requestPermission().then(function(r){if(r!=='granted')throw new Error('Chưa được cho phép ('+r+')');return ppSub()}).then(function(){ppMsg='✅ Đã đăng ký xong. Bấm Gửi thử để kiểm tra.';ppCheck()}).catch(function(e){ppMsg='❌ '+((e&&e.message)||e);ppCheck()})}
function ppTest(){audio();setTimeout(beep,300);ppMsg='Đang gửi thử…';ppCheck();fetch('/api/push',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({test:true})}).then(function(r){if(!r.ok)throw new Error('máy chủ trả '+r.status);return r.json()}).then(function(d){var rs=d.results||[];if(!rs.length)ppMsg='❌ Máy chủ chưa có máy nào đăng ký. Bấm Bật / đăng ký lại.';else ppMsg=rs.map(function(x){return (x.ok?'✅ ':'❌ ')+x.host+' → '+x.status+(x.info?' '+x.info:'')}).join('\n')+(d.sent?'\nVài giây nữa máy sẽ có thông báo.':'');ppCheck()}).catch(function(e){ppMsg='❌ '+((e&&e.message)||e);ppCheck()})}
function ppRefresh(){if(pSup()&&Notification.permission==='granted')ppSub().catch(function(){})}
function tab(t){cur=t;draw()}
function upd(){var n=O.filter(function(o){return o.s==='new'}).length;$('pn').textContent=n+' chờ';var on=n>0&&!muted;ring(on);document.body.className=n>0?'alert':'';var al=$('al');if(al){al.style.display=n>0?'flex':'none';var nn=O.filter(function(o){return o.s==='new'})[0];$('alt').textContent=nn?'#'+String(nn.id).slice(-6).toUpperCase()+(nn.total?' · '+fmt(nn.total):'')+(nn.paid?' · đã thanh toán':'')+(n>1?' · và '+(n-1)+' đơn nữa':''):''}document.title=(n>0?'('+n+') ĐƠN MỚI · ':'')+'Đơn hàng'}
function hm(a){var d=new Date(a);return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
// Địa chỉ giao + nút mở Google Maps (xem vị trí / chỉ đường cho người giao)
function shipBox(o){if(!o.addr)return '';var ll=o.lat&&o.lng?o.lat+','+o.lng:encodeURIComponent(o.addr);
return '<div class="ship"><div>📍 <b>'+esc(o.addr)+'</b>'+(o.km!=null?' · cách quán '+String(o.km).replace('.',',')+' km'+(o.road===false?' (ước chừng)':''):'')+'</div><div class="row"><a class="mapl" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+ll+'">🗺️ Xem bản đồ</a><a class="mapl" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving">🧭 Chỉ đường</a></div></div>'}
function card(o){var h='<div class="o '+(o.s==='new'?'n':'')+'"><div class="oh"><span>#'+esc(String(o.id).slice(-6).toUpperCase())+' · '+esc(o.name||'Khách')+' · <a href="tel:'+esc(o.phone||'')+'">'+esc(o.phone||'')+'</a></span><small>'+hm(o.at)+(o.total?' · '+fmt(o.total):'')+'</small></div>'+(o.paid?'<div style="color:var(--ok);font-weight:600;font-size:14px;margin-top:4px">✅ Đã thanh toán '+fmt(o.paid/1000)+(o.late?' (trả trễ)':'')+'</div>':'')+'<pre>'+esc(o.t)+'</pre>'+shipBox(o);
if(o.s==='new')h+='<button class="big rd" onclick="setS(\''+o.id+'\',\'doing\')">Đã nhận đơn</button>';
else if(o.s==='doing')h+='<div class="row"><button class="gr" onclick="setS(\''+o.id+'\',\'done\')">Hoàn thành</button><button class="g" onclick="cp(\''+o.id+'\')">Sao chép</button></div>';
else h+='<div class="row"><button class="g" onclick="cp(\''+o.id+'\')">Sao chép</button><button class="g" onclick="setS(\''+o.id+'\',\'doing\')">Mở lại</button></div>';
return h+'</div>'}
function draw(){upd();var today=new Date().toDateString(),sum=0,cnt=0;O.forEach(function(o){if(new Date(o.at).toDateString()===today){cnt++;sum+=o.total||0}});$('rv').textContent='Hôm nay: '+cnt+' đơn · '+fmt(sum);
var L={new:'Mới',doing:'Đang làm',done:'Xong'};['new','doing','done'].forEach(function(s){var l=O.filter(function(o){return o.s===s});if(s==='done')l=l.filter(function(o){return new Date(o.at).toDateString()===today});$('t_'+s).textContent=L[s]+' ('+l.length+')';$('t_'+s).className=cur===s?'on':'';var c=$('c_'+s);c.className='col'+(cur===s?' cur':'');c.innerHTML='<h2><svg aria-hidden="true"><use href="#p-'+({new:'peek',doing:'hug',done:'sleep'})[s]+'"/></svg>'+L[s]+' <i>'+l.length+'</i></h2>'+(l.length?l.map(card).join(''):'<div class="em">Chưa có đơn</div>')})}
function tmf(a){var d=new Date(String(a||'').replace(' ','T'));return isNaN(d)?String(a||''):d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}
function drawUn(l){var e=$('un');if(!l.length){e.style.display='none';return}e.style.display='block';e.innerHTML='<b>💰 Tiền vào chưa khớp đơn ('+l.length+')</b><div style="font-size:13px;color:var(--mut);margin:2px 0 6px">Kiểm tra trong app ngân hàng: nhận đơn thủ công hoặc hoàn tiền cho khách, xong bấm Đã xử lý.</div>'+l.map(function(u){return '<div style="border-top:1px dashed var(--ln);padding:8px 0;display:flex;gap:8px;justify-content:space-between;align-items:center"><div><b>'+fmt((u.amount||0)/1000)+'</b> · <small>'+esc(tmf(u.at))+'</small><br><small>'+esc(u.content||'')+'</small><br><small style="color:var(--mr)">'+esc(u.reason||'')+'</small></div><button class="g" onclick="unDone(\''+esc(u.k)+'\',this)">Đã xử lý</button></div>'}).join('')}
function unDone(k,b){b.disabled=true;fetch('/api/orders',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({dismiss:k})}).then(function(){poll()}).catch(function(){b.disabled=false})}
function setS(id,s){audio();LS[id]={s:s,t:Date.now()};O.forEach(function(o){if(o.id===id)o.s=s});draw();fetch('/api/orders',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({id:id,s:s})}).catch(function(){bn('Chưa lưu được trạng thái, kiểm tra mạng')})}
function pinReset(){var p=prompt('Số điện thoại của khách cần đặt lại mã PIN:');if(!p)return;fetch('/api/my',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({phone:p,reset:true})}).then(function(r){return r.json().catch(function(){return {}}).then(function(d){alert(r.ok?(d.ok?'Đã xóa mã PIN của số '+p+'. Khách bấm Đăng ký lại với mã PIN mới là được, lịch sử đơn vẫn giữ.':'Số '+p+' chưa có mã PIN.'):'Lỗi: '+(d.err||r.status))})}).catch(function(){alert('Không kết nối được')})}
function cp(id){var o=O.filter(function(x){return x.id===id})[0];if(!o)return;try{navigator.clipboard.writeText(o.t)}catch(e){}}
function view(){showStock=!showStock;$('orders').style.display=showStock?'none':'';$('stock').style.display=showStock?'':'none';$('vb').textContent=showStock?'Về đơn hàng':'Hết món';if(showStock)loadStock()}
function loadStock(){fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){CFG=d;drawStock()}).catch(function(){$('stock').innerHTML='<div class="em">Không tải được menu</div>'})}
function drawStock(){if(!CFG||!CFG.cats){$('stock').innerHTML='<div class="em">Chưa có menu nào được lưu. Vào trang quản lý chính để lưu menu trước.</div>';return}
var h='';CFG.cats.forEach(function(c,ci){h+='<h2 style="color:var(--mut);font-size:15px;margin:14px 0 6px">'+esc(c.n||'')+'</h2>';(c.i||[]).forEach(function(x,ii){h+='<div class="it '+(x.off?'off':'')+'"><span>'+esc(x.n)+'</span><button class="'+(x.off?'rd':'g')+'" onclick="tg('+ci+','+ii+')">'+(x.off?'Đang hết':'Còn hàng')+'</button></div>'})});$('stock').innerHTML=h}
function tg(ci,ii){var x=CFG.cats[ci].i[ii];x.off=x.off?0:1;drawStock();fetch('/api/config',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify(CFG)}).then(function(r){if(!r.ok)bn('Chưa lưu được, thử lại')}).catch(function(){bn('Chưa lưu được, thử lại')})}
</script></body></html>
