<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đơn hàng · Quản lý</title>
<link rel="manifest" href="/manifest-don.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#c62a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Đơn hàng">
<style>
:root{--bg:#f3efe9;--cd:#fff;--ink:#2b2220;--mut:#7d6f6a;--ln:#e3d9d1;--mr:#c62a3a;--ok:#2e7d5b;--wa:#d98a00;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.alert{animation:fl 1s infinite}@keyframes fl{0%,100%{background:#f3efe9}50%{background:#ffb3b3}}
header{position:sticky;top:0;z-index:5;background:var(--cd);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:18px;margin:0;flex:1 1 auto}
.pill{padding:6px 12px;border-radius:99px;background:var(--bg);font-weight:600;font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:600}
button.g{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
button.big{width:100%;padding:16px;font-size:18px}
.rd{background:var(--mr)}.gr{background:var(--ok)}.am{background:var(--wa)}
#bn{display:none;background:var(--mr);color:#fff;padding:10px 14px;text-align:center;font-weight:600}
.tabs{display:flex;gap:6px;padding:10px 14px 0}.tabs button{flex:1;background:var(--cd);color:var(--ink);border:1px solid var(--ln)}.tabs button.on{background:var(--ink);color:#fff}
.cols{display:grid;gap:12px;padding:12px 14px;grid-template-columns:1fr}
.col{display:none}.col.cur{display:block}
@media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr)}.col{display:block}.tabs{display:none}}
.col h2{font-size:15px;margin:0 0 8px;color:var(--mut)}
.o{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.o.n{border:2px solid var(--mr)}
.oh{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.oh small{font-weight:500;color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0}
.row{display:flex;gap:8px}.row button{flex:1}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.it.off{opacity:.65}
#lg{max-width:360px;margin:12vh auto;padding:20px;background:var(--cd);border-radius:16px;border:1px solid var(--ln)}
#lg input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;font:inherit;margin:10px 0}
.em{color:var(--mut);text-align:center;padding:18px}
</style></head><body>
<div id="lg"><h2 style="margin:0">Đăng nhập quản lý đơn</h2><p style="color:var(--mut);margin:6px 0 0">Bấm vào đây một lần để bật chuông.</p><div id="le" style="color:var(--mr);margin-top:8px"></div><input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password"><button class="big" onclick="login()">Vào</button></div>
<div id="app" style="display:none">
<div id="bn"></div>
<header><h1>🧋 Đơn hàng</h1><span class="pill" id="pn">0 chờ</span><span class="pill" id="rv"></span><span class="pill" id="up" style="font-weight:500"></span><span class="pill" id="gp" style="display:none;background:#ffe3a3"></span><button class="g" id="nb" onclick="pp()">🔔 Thông báo: Chưa bật</button><button class="g" id="mb" onclick="mute()">🔔 Chuông: Bật</button><button class="g" id="vb" onclick="view()">Hết món</button></header>
<div id="orders"><div class="tabs"><button onclick="tab('new')" id="t_new">Mới</button><button onclick="tab('doing')" id="t_doing">Đang làm</button><button onclick="tab('done')" id="t_done">Xong</button></div>
<div class="cols"><div class="col" id="c_new"></div><div class="col" id="c_doing"></div><div class="col" id="c_done"></div></div></div>
<div id="stock" style="display:none;padding:12px 14px"></div>
</div>
<div id="pp" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto"><h3 style="margin:0 0 8px">Thông báo đẩy</h3><div id="ppb"></div><div class="row" style="margin-top:12px"><button class="rd" onclick="ppEnable()">Bật / đăng ký lại</button><button class="gr" onclick="ppTest()">Gửi thử</button></div><button class="g big" style="margin-top:8px;padding:10px" onclick="ppClose()">Đóng</button></div></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.t==='poll'&&PW)poll()})}
['focus','pageshow','online'].forEach(function(ev){window.addEventListener(ev,function(){if(PW&&$('app').style.display!=='none')poll()})});
var LP=0,LS={},PW='',O=[],CFG=null,cur='new',muted=false,AC=null,ringT=null,fails=0,wl=null,showStock=false,first=true;
try{PW=localStorage.getItem('pw')||''}catch(e){}
var $=function(i){return document.getElementById(i)};
var fmt=function(k){return (k*1000).toLocaleString('vi-VN')+'đ'};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var VB=null,VL=0;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();loadVoice()}catch(e){}}
function loadVoice(){if(VB||VL||!AC)return;VL=1;fetch('/don-moi.mp3').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(b){return new Promise(function(ok,no){var p=AC.decodeAudioData(b,ok,no);if(p&&p.then)p.then(ok,no)})}).then(function(x){VB=x}).catch(function(){VL=0})}
function say(){if(VB){var s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1;s.buffer=VB;s.connect(g);g.connect(AC.destination);s.start();return true}
try{if(window.speechSynthesis){var v=speechSynthesis.getVoices().filter(function(x){return /^vi/i.test(x.lang)})[0];if(v){var u=new SpeechSynthesisUtterance('Có đơn hàng mới. Có đơn hàng mới.');u.voice=v;u.lang=v.lang;u.rate=1;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u);return true}}}catch(e){}return false}
document.addEventListener('click',audio);document.addEventListener('touchstart',audio);
function beep(){if(!AC||AC.state!=='running')return;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}if(say())return;var t=AC.currentTime;[[880,0],[660,.22],[880,.44]].forEach(function(x){var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=x[0];g.gain.setValueAtTime(0,t+x[1]);g.gain.linearRampToValueAtTime(.35,t+x[1]+.02);g.gain.linearRampToValueAtTime(0,t+x[1]+.18);o.connect(g);g.connect(AC.destination);o.start(t+x[1]);o.stop(t+x[1]+.2)});try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
var ringOn=false,lastBeep=0,TK=0,busy=0;function ring(on){if(on&&!ringOn){ringOn=true;lastBeep=Date.now();beep()}else if(!on)ringOn=false}
function tick(){TK++;if(TK%3===0)poll();if(ringOn&&Date.now()-lastBeep>=(VB?4000:1800)){lastBeep=Date.now();beep()}if(TK%2===0&&AC&&AC.state!=='running'&&O.some(function(o){return o.s==='new'}))bn('Chạm vào màn hình để bật chuông')}
function mkTick(){try{var b=new Blob(['setInterval(function(){postMessage(1)},1000)'],{type:'text/javascript'}),w=new Worker(URL.createObjectURL(b));w.onmessage=tick}catch(e){setInterval(tick,1000)}}
function mute(){muted=!muted;$('mb').textContent='🔔 Chuông: '+(muted?'Tắt':'Bật');upd()}
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&PW){wake();poll();audio()}});
function login(){var p=$('pw').value.trim();audio();fetch('/api/orders',{headers:{'x-admin':p}}).then(function(r){if(r.ok){PW=p;try{localStorage.setItem('pw',p)}catch(e){}start()}else $('le').textContent='Sai mật khẩu ('+r.status+')'}).catch(function(){$('le').textContent='Không kết nối được'})}
function start(){$('lg').style.display='none';$('app').style.display='';wake();ppRefresh();poll();mkTick();try{if(navigator.locks)navigator.locks.request('don-keepalive',function(){return new Promise(function(){})})}catch(e){}}
function bn(t){var b=$('bn');b.textContent=t;b.style.display=t?'block':'none'}
function poll(){if(busy&&Date.now()-busy<15000)return;busy=Date.now();poll0().then(function(){busy=0},function(){busy=0})}
function poll0(){return fetch('/api/orders',{headers:{'x-admin':PW},cache:'no-store'}).then(function(r){if(r.status===401){PW='';try{localStorage.removeItem('pw')}catch(e){}location.reload();return null}return r.json()}).then(function(d){if(!d)return;var nw=Date.now();if(LP&&nw-LP>12000){$('gp').style.display='';$('gp').textContent='⏱ Từng đứng '+Math.round((nw-LP)/1000)+'s lúc '+new Date(nw).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}LP=nw;fails=0;$('up').textContent='Cập nhật '+new Date(nw).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});if(AC&&AC.state==='running'&&$('bn').textContent.indexOf('Chạm')===0)bn('');O=d.orders||[];O.forEach(function(o){var l=LS[o.id];if(l&&Date.now()-l.t<15000)o.s=l.s});draw()}).catch(function(){fails++;if(fails>=2)bn('Mất kết nối mạng, đang thử lại…')})}

function b2u(b){var s=(b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function inApp(){return navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function pSup(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
var ppMsg='';
function ppShow(rows){var h=rows.map(function(r){return '<div style="margin:6px 0">'+(r[0]?'✅ ':'❌ ')+esc(r[1])+(r[2]?'<br><small style="color:var(--mut)">'+esc(r[2])+'</small>':'')+'</div>'}).join('');h+='<div style="margin-top:10px;font-weight:600;white-space:pre-wrap">'+esc(ppMsg)+'</div>';$('ppb').innerHTML=h}
function pp(){$('pp').style.display='flex';ppMsg='';ppCheck()}
function ppClose(){$('pp').style.display='none'}
function ppCheck(){var rows=[],sup=pSup();rows.push([sup,'Máy hỗ trợ thông báo đẩy',sup?'':(isIOS()&&!inApp()?'Trên iPhone/iPad: bấm nút chia sẻ của Safari, chọn Thêm vào MH chính, rồi mở app từ icon ngoài màn hình chính.':'Trình duyệt này không hỗ trợ.')]);if(!sup){ppShow(rows);return}
var perm=Notification.permission;rows.push([perm==='granted','Quyền thông báo: '+({granted:'đã cho phép',denied:'đang bị chặn',default:'chưa cấp'}[perm]||perm),perm==='denied'?'Mở cài đặt trình duyệt hoặc máy, cho phép thông báo cho trang này rồi bấm Bật lại.':(perm==='default'?'Bấm Bật / đăng ký lại và chọn Cho phép.':'')]);
navigator.serviceWorker.getRegistration().then(function(reg){return reg?reg.pushManager.getSubscription():null}).then(function(s){rows.push([!!s,'Máy này đã đăng ký nhận thông báo',s?'':'Bấm Bật / đăng ký lại.']);ppShow(rows)}).catch(function(){ppShow(rows)})}
function ppSub(){return navigator.serviceWorker.ready.then(function(reg){return fetch('/api/push',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('lấy khóa lỗi '+r.status);return r.json()}).then(function(d){var key=b2u(d.key);return reg.pushManager.getSubscription().then(function(s){if(s&&s.options&&s.options.applicationServerKey){var cur=new Uint8Array(s.options.applicationServerKey);var same=cur.length===key.length&&cur.every(function(v,i){return v===key[i]});if(!same)return s.unsubscribe().then(function(){return null})}return s}).then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key})})})}).then(function(s){return fetch('/api/push',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).then(function(r){if(!r.ok)throw new Error('máy chủ từ chối lưu ('+r.status+')');$('nb').textContent='🔔 Thông báo: Bật'})})}
function ppEnable(){audio();if(!pSup()){ppCheck();return}ppMsg='Đang bật…';ppCheck();Notification.requestPermission().then(function(r){if(r!=='granted')throw new Error('Chưa được cho phép ('+r+')');return ppSub()}).then(function(){ppMsg='✅ Đã đăng ký xong. Bấm Gửi thử để kiểm tra.';ppCheck()}).catch(function(e){ppMsg='❌ '+((e&&e.message)||e);ppCheck()})}
function ppTest(){audio();setTimeout(beep,300);ppMsg='Đang gửi thử…';ppCheck();fetch('/api/push',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({test:true})}).then(function(r){if(!r.ok)throw new Error('máy chủ trả '+r.status);return r.json()}).then(function(d){var rs=d.results||[];if(!rs.length)ppMsg='❌ Máy chủ chưa có máy nào đăng ký. Bấm Bật / đăng ký lại.';else ppMsg=rs.map(function(x){return (x.ok?'✅ ':'❌ ')+x.host+' → '+x.status+(x.info?' '+x.info:'')}).join('\n')+(d.sent?'\nVài giây nữa máy sẽ có thông báo.':'');ppCheck()}).catch(function(e){ppMsg='❌ '+((e&&e.message)||e);ppCheck()})}
function ppRefresh(){if(pSup()&&Notification.permission==='granted')ppSub().catch(function(){})}
function tab(t){cur=t;draw()}
function upd(){var n=O.filter(function(o){return o.s==='new'}).length;$('pn').textContent=n+' chờ';var on=n>0&&!muted;ring(on);document.body.className=n>0?'alert':'';document.title=(n>0?'('+n+') ĐƠN MỚI · ':'')+'Đơn hàng'}
function hm(a){var d=new Date(a);return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function card(o){var h='<div class="o '+(o.s==='new'?'n':'')+'"><div class="oh"><span>#'+esc(String(o.id).slice(-6).toUpperCase())+' · '+esc(o.name||'Khách')+' · <a href="tel:'+esc(o.phone||'')+'">'+esc(o.phone||'')+'</a></span><small>'+hm(o.at)+(o.total?' · '+fmt(o.total):'')+'</small></div><pre>'+esc(o.t)+'</pre>';
if(o.s==='new')h+='<button class="big rd" onclick="setS(\''+o.id+'\',\'doing\')">Đã nhận đơn</button>';
else if(o.s==='doing')h+='<div class="row"><button class="gr" onclick="setS(\''+o.id+'\',\'done\')">Hoàn thành</button><button class="g" onclick="cp(\''+o.id+'\')">Sao chép</button></div>';
else h+='<div class="row"><button class="g" onclick="cp(\''+o.id+'\')">Sao chép</button><button class="g" onclick="setS(\''+o.id+'\',\'doing\')">Mở lại</button></div>';
return h+'</div>'}
function draw(){upd();var today=new Date().toDateString(),sum=0,cnt=0;O.forEach(function(o){if(new Date(o.at).toDateString()===today){cnt++;sum+=o.total||0}});$('rv').textContent='Hôm nay: '+cnt+' đơn · '+fmt(sum);
var L={new:'Mới',doing:'Đang làm',done:'Xong'};['new','doing','done'].forEach(function(s){var l=O.filter(function(o){return o.s===s});if(s==='done')l=l.filter(function(o){return new Date(o.at).toDateString()===today});$('t_'+s).textContent=L[s]+' ('+l.length+')';$('t_'+s).className=cur===s?'on':'';var c=$('c_'+s);c.className='col'+(cur===s?' cur':'');c.innerHTML='<h2>'+L[s]+' ('+l.length+')</h2>'+(l.length?l.map(card).join(''):'<div class="em">Chưa có đơn</div>')})}
function setS(id,s){audio();LS[id]={s:s,t:Date.now()};O.forEach(function(o){if(o.id===id)o.s=s});draw();fetch('/api/orders',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify({id:id,s:s})}).catch(function(){bn('Chưa lưu được trạng thái, kiểm tra mạng')})}
function cp(id){var o=O.filter(function(x){return x.id===id})[0];if(!o)return;try{navigator.clipboard.writeText(o.t)}catch(e){}}
function view(){showStock=!showStock;$('orders').style.display=showStock?'none':'';$('stock').style.display=showStock?'':'none';$('vb').textContent=showStock?'Về đơn hàng':'Hết món';if(showStock)loadStock()}
function loadStock(){fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){CFG=d;drawStock()}).catch(function(){$('stock').innerHTML='<div class="em">Không tải được menu</div>'})}
function drawStock(){if(!CFG||!CFG.cats){$('stock').innerHTML='<div class="em">Chưa có menu nào được lưu. Vào trang quản lý chính để lưu menu trước.</div>';return}
var h='';CFG.cats.forEach(function(c,ci){h+='<h2 style="color:var(--mut);font-size:15px;margin:14px 0 6px">'+esc(c.n||'')+'</h2>';(c.i||[]).forEach(function(x,ii){h+='<div class="it '+(x.off?'off':'')+'"><span>'+esc(x.n)+'</span><button class="'+(x.off?'rd':'g')+'" onclick="tg('+ci+','+ii+')">'+(x.off?'Đang hết':'Còn hàng')+'</button></div>'})});$('stock').innerHTML=h}
function tg(ci,ii){var x=CFG.cats[ci].i[ii];x.off=x.off?0:1;drawStock();fetch('/api/config',{method:'POST',headers:{'x-admin':PW,'content-type':'application/json'},body:JSON.stringify(CFG)}).then(function(r){if(!r.ok)bn('Chưa lưu được, thử lại')}).catch(function(){bn('Chưa lưu được, thử lại')})}
</script></body></html>
